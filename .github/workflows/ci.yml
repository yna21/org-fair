name: CI

# Analyze, test and build on every pull request and every push.
on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keep these Flutter setup lines the same in deploy.yml.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Errors still fail this step. The two CMS files you did not choose keep
      # their "unused variable" warnings, and newer Flutter versions add
      # "deprecated" infos, so warnings and infos must not fail the build.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

      - run: flutter build web --release