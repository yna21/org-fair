name: Android release APK

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=upload"
            echo "storeFile=$RUNNER_TEMP/upload-keystore.jks"
          } > android/key.properties

      - name: Build release APK
        run: >-
          flutter build apk --release
          --dart-define=CMS=${{ vars.CMS }}
          --dart-define=CMS_SPACE=${{ vars.CMS_SPACE }}
          --dart-define=CMS_TOKEN=${{ secrets.CMS_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: org-fair-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk